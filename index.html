<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LX SHAKIL YT - Official App Store</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent: #00f2fe;
            --accent-hover: #4facfe;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        /* Header */
        header {
            background: rgba(21, 28, 44, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1e293b;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img {
            width: 45px; height: 45px; border-radius: 50%;
            border: 2px solid var(--accent); object-fit: cover;
        }
        .brand h1 { font-size: 1.3rem; letter-spacing: 1px; color: var(--accent); }

        /* Search & Filter */
        .controls { padding: 20px 5%; max-width: 1200px; margin: auto; }
        .search-box {
            width: 100%; padding: 12px 20px; border-radius: 10px;
            border: 1px solid #334155; background: var(--card-bg);
            color: white; font-size: 1rem; outline: none; margin-bottom: 15px;
        }
        .search-box:focus { border-color: var(--accent); }
        .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .cat-btn {
            padding: 8px 16px; border-radius: 20px; border: none;
            background: var(--card-bg); color: var(--text-sub);
            cursor: pointer; font-weight: 600; transition: 0.3s; white-space: nowrap;
        }
        .cat-btn.active, .cat-btn:hover { background: var(--accent); color: #000; }

        /* App Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; padding: 10px 5%; max-width: 1200px; margin: auto;
        }
        .app-card {
            background: var(--card-bg); border-radius: 15px; padding: 18px;
            display: flex; align-items: center; gap: 15px;
            border: 1px solid #1e293b; transition: 0.3s;
        }
        .app-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .app-icon { width: 65px; height: 65px; border-radius: 14px; object-fit: cover; }
        .app-info { flex: 1; }
        .app-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
        .app-meta { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px; }
        .dl-btn {
            display: inline-block; padding: 7px 16px; border-radius: 8px;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            color: #000; text-decoration: none; font-weight: bold; font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <!-- এখানে আপনার চ্যানেলের লোগোর লিংক বসাবেন -->
            <img src="https://via.placeholder.com/100/00f2fe/000000?text=LX" alt="Channel Logo" id="channelLogo">
            <h1>LX SHAKIL YT</h1>
        </div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="আপনার পছন্দের অ্যাপ খুঁজুন...">
        <div class="categories">
            <button class="cat-btn active" onclick="filterApps('all', this)">সব অ্যাপ</button>
            <button class="cat-btn" onclick="filterApps('gaming', this)">গেমিং</button>
            <button class="cat-btn" onclick="filterApps('tools', this)">টুলস</button>
            <button class="cat-btn" onclick="filterApps('editing', this)">এডিটিং</button>
        </div>
    </div>

    <div class="app-grid" id="appContainer"></div>

    <script>
        // এখান থেকে আপনি নতুন অ্যাপ যুক্ত করতে পারবেন
        const apps = [
            {
                name: "FF Sensitivity Tool",
                category: "gaming",
                size: "12 MB",
                version: "v2.4",
                icon: "https://via.placeholder.com/100/ff4b2b/ffffff?text=FF",
                downloadUrl: "https://mediafire.com/your-link-1"
            },
            {
                name: "GFX Pro Max",
                category: "tools",
                size: "8.5 MB",
                version: "v1.0",
                icon: "https://via.placeholder.com/100/00c6ff/ffffff?text=GFX",
                downloadUrl: "https://mediafire.com/your-link-2"
            },
            {
                name: "Video Editor Pro",
                category: "editing",
                size: "45 MB",
                version: "v5.1",
                icon: "https://via.placeholder.com/100/8e2de2/ffffff?text=Edit",
                downloadUrl: "https://mediafire.com/your-link-3"
            }
        ];

        const container = document.getElementById('appContainer');

        function renderApps(list) {
            container.innerHTML = "";
            list.forEach(app => {
                container.innerHTML += `
                    <div class="app-card">
                        <img src="${app.icon}" alt="${app.name}" class="app-icon">
                        <div class="app-info">
                            <div class="app-title">${app.name}</div>
                            <div class="app-meta">${app.version} • ${app.size}</div>
                            <a href="${app.downloadUrl}" target="_blank" class="dl-btn">Download</a>
                        </div>
                    </div>
                `;
            });
        }

        function filterApps(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'all') renderApps(apps);
            else renderApps(apps.filter(a => a.category === cat));
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderApps(apps.filter(a => a.name.toLowerCase().includes(term)));
        });

        renderApps(apps);
    </script>
</body>
</html>
